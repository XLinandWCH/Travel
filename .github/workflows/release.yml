name: Release Build

# 手动触发：在 Actions 页面点击 "Run workflow"，填写版本号后运行
on:
  workflow_dispatch:
    inputs:
      versionName:
        description: '应用版本号（如 1.2.0）'
        required: true
        default: '1.0'
      versionCode:
        description: 'Android versionCode（纯整数，每次发版需递增）'
        required: true
        default: '1'
      allowUnsigned:
        description: '允许未签名产物（仅调试用；正式分发必须留空，否则缺 Secrets 会直接失败）'
        required: false
        default: 'false'

jobs:
  # ============================================================
  # Android —— 主推平台：独立 job，与 iOS 互不影响
  # ============================================================
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle（依赖与 Kotlin 编译缓存）
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 从 Secrets 还原签名证书（BASE64 编码的 jks / pkcs12 文件），并写入 signing.properties
      # 供 app/androidApp/build.gradle.kts 读取。
      # 这里不再“静默降级为未签名”：缺哪个 Secret 就明确报错，避免打出装不上的包。
      - name: Decode & Verify Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ALLOW_UNSIGNED: ${{ github.event.inputs.allowUnsigned }}
        run: |
          set -e
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$KEY_ALIAS" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing ANDROID_KEY_PASSWORD"
          [ -z "$STORE_PASSWORD" ] && missing="$missing ANDROID_STORE_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::❌ 缺少 GitHub Secrets：$missing"
            echo "   请到仓库 Settings → Secrets and variables → Actions → New repository secret 里添加；"
            echo "   注意必须是 Secrets（放在 Environments / Variables 里的同名条目在这里读不到）。"
            if [ "$ALLOW_UNSIGNED" != "true" ]; then exit 1; fi
            echo "⚠️ allowUnsigned=true，继续产出未签名包（仅调试）"
            rm -f "$GITHUB_WORKSPACE/signing.properties"
            exit 0
          fi
          KS="$GITHUB_WORKSPACE/travel-release.jks"
          # 去掉 Windows 换行与折行空格再解码，避免 base64 -d 因非法字符截断
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$KS"
          echo "密钥库大小：$(wc -c < "$KS") bytes"
          # 自检：能不能用该口令列出这个别名（JKS / PKCS12 都适用），失败说明口令或文件有问题
          if ! keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null; then
            echo "::error::❌ 密钥库校验失败：storePassword / keyAlias 不对，或 jks 在 Base64 传输中被截断损坏"
            exit 1
          fi
          echo "✅ 密钥库校验通过（别名 $KEY_ALIAS）"
          {
            echo "sign.keyStore=$KS"
            echo "sign.keyAlias=$KEY_ALIAS"
            echo "sign.keyPassword=$KEY_PASSWORD"
            echo "sign.storePassword=$STORE_PASSWORD"
          } > "$GITHUB_WORKSPACE/signing.properties"

      - name: Build Debug + Release APK
        run: >
          ./gradlew :app:androidApp:assembleDebug :app:androidApp:assembleRelease
          -Prelease.versionName="${{ github.event.inputs.versionName }}"
          -Prelease.versionCode="${{ github.event.inputs.versionCode }}"
          --stacktrace

      # 数据库自检：确认 androidx.sqlite 2.7.1 的 BundledSQLiteDriver
      # 原生库（libsqliteJni.so）已打进 APK，各 ABI 缺一不可
      - name: Verify bundled SQLite native libs
        run: |
          set -e
          APK=$(find app/androidApp/build/outputs/apk -name '*.apk' | head -n 1)
          echo "检查 $APK 中的 SQLite 原生库："
          unzip -l "$APK" | grep 'libsqliteJni.so'
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$APK" | grep -q "lib/$ABI/libsqliteJni.so" \
              || { echo "❌ 缺少 lib/$ABI/libsqliteJni.so"; exit 1; }
            echo "✅ lib/$ABI/libsqliteJni.so"
          done

      - name: Upload Debug APK（可直接安装）
        uses: actions/upload-artifact@v4
        with:
          name: Travel-Android-Debug-v${{ github.event.inputs.versionName }}
          path: app/androidApp/build/outputs/apk/debug/androidApp-debug.apk

      # 已签名时产物为 androidApp-release.apk，未签名时为 *-unsigned.apk
      # 这里用 apksigner 实测验签：没签上就立刻失败，不再把装不上的包推给你下载
      - name: Verify Signature + Rename Release APK
        env:
          ALLOW_UNSIGNED: ${{ github.event.inputs.allowUnsigned }}
        run: |
          set -e
          APK=$(find app/androidApp/build/outputs/apk/release -name '*.apk' | head -n 1)
          echo "Release 产物：$APK"
          if echo "$APK" | grep -q 'unsigned'; then
            if [ "$ALLOW_UNSIGNED" = "true" ]; then
              echo "::warning::按 allowUnsigned=true 放行：这是未签名包，装不上，只能用于看体积 / 调试"
            else
              echo "::error::❌ 这是未签名包（文件名含 unsigned），说明签名配置没有注入成功"
              exit 1
            fi
          else
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort | tail -n 1)
            echo "使用验签工具：$APKSIGNER"
            "$APKSIGNER" verify --print-certs "$APK"
            echo "✅ 验签通过（v1 / v2 / v3 至少一种生效）"
          fi
          mv "$APK" "Travel-v${{ github.event.inputs.versionName }}-Android-release.apk"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Travel-Android-Release-v${{ github.event.inputs.versionName }}
          path: Travel-*-Android-release.apk

  # ============================================================
  # iOS —— 附带平台：continue-on-error，失败不影响整体工作流状态，
  #        且与 Android job 完全独立，不会阻塞 / 拖垮 Android
  # ============================================================
  ios:
    name: iOS App (unsigned)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle（缓存 Kotlin/Native 与 Konan）
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Xcode 的 "Compile Kotlin Framework" 构建阶段会自动调用
      # ./gradlew :app:shared:embedAndSignAppleFrameworkForXcode，
      # sqlite-bundled 的 iOS 原生库会静态链接进 Shared.framework
      - name: Build iOS App (Release, 无签名)
        run: >
          xcodebuild
          -project app/iosApp/iosApp.xcodeproj
          -scheme iosApp
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath build_ios/DerivedData
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=
          MARKETING_VERSION=${{ github.event.inputs.versionName }}
          CURRENT_PROJECT_VERSION=${{ github.event.inputs.versionCode }}
          build

      - name: Package unsigned .ipa
        run: |
          set -e
          APP=$(find build_ios/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          echo "打包 $APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -qry "Travel-iOS-v${{ github.event.inputs.versionName }}-unsigned.ipa" Payload

      - name: Upload iOS artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Travel-iOS-unsigned-v${{ github.event.inputs.versionName }}
          path: Travel-iOS-v${{ github.event.inputs.versionName }}-unsigned.ipa

      - name: iOS 构建失败提示
        if: failure()
        run: echo "::warning::iOS 打包失败，但不影响 Android 产物。iOS 为附带平台，请查看上方 xcodebuild 日志排查。"
