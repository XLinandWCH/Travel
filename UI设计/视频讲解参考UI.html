<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI 自由对话 UI 还原</title>
<style>
  /* 基础重置与手机外壳模拟 */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  
  body {
    background-color: #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* 手机容器 (模拟截图比例) */
  .phone-container {
    width: 390px;
    height: 844px; /* iPhone 12/13/14 比例 */
    background-color: #121212;
    color: #fff;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* 顶部状态栏 (视觉还原) */
  .status-bar {
    height: 44px;
    padding: 14px 16px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 15px;
    font-weight: 600;
    z-index: 10;
  }
  .status-left { display: flex; align-items: center; gap: 6px; }
  .status-right { display: flex; align-items: center; gap: 6px; }
  .icon-wifi, .icon-battery { width: 18px; height: 12px; background: #fff; border-radius: 2px; display: inline-block; }

  /* 顶部控制区 */
  .top-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
    z-index: 10;
  }
  
  .mode-badge {
    background-color: #2c2c2c;
    padding: 6px 14px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 16px;
    margin: 0 auto;
  }
  .mode-badge .wechat-icon {
    color: #07C160;
    font-size: 18px;
  }
  .mode-badge .arrow { font-size: 12px; opacity: 0.7; }
  
  .voice-user-icon {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.9;
  }

  /* 中间摄像头区域 */
  .camera-area {
    flex: 1;
    margin: 10px 16px 20px;
    border-radius: 24px;
    background-color: #333;
    position: relative;
    overflow: hidden;
    /* 模拟图中的木纹背景，实际开发中可替换为 <video> 标签 */
    background-image: url('https://images.unsplash.com/photo-1541123603104-512919d6a96c?auto=format&fit=crop&q=80&w=600'); 
    background-size: cover;
    background-position: center;
  }

  /* 摄像头内悬浮按钮 */
  .cam-overlay {
    position: absolute;
    bottom: 20px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 24px;
  }
  
  .cam-btn {
    color: #fff;
    font-size: 24px;
    opacity: 0.9;
    text-shadow: 0 1px 3px rgba(0,0,0,0.3);
  }

  .listening {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 17px;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.3);
  }
  .dot {
    width: 22px;
    height: 22px;
    background: linear-gradient(135deg, #6cb7ff, #5fe3a5);
    border-radius: 50%;
    display: block;
  }

  /* 底部操作栏 */
  .bottom-actions {
    height: 120px;
    display: flex;
    justify-content: space-evenly;
    align-items: center;
    padding-bottom: 20px;
    z-index: 10;
  }

  .action-btn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background-color: #1e1e1e;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
    font-size: 26px;
    border: none;
    cursor: pointer;
    transition: 0.2s;
  }
  .action-btn:active { transform: scale(0.92); }
  
  .action-btn.active { background-color: #fff; color: #000; }
  .action-btn.disabled { background-color: #333; opacity: 0.8; }
  .action-btn.hangup { background-color: #e85d4e; color: #fff; }

  /* 底部提示与横线 */
  .footer-text {
    text-align: center;
    font-size: 12px;
    color: #888;
    margin-bottom: 8px;
  }
  .home-indicator {
    width: 130px;
    height: 5px;
    background-color: #ccc;
    border-radius: 3px;
    margin: 0 auto 8px;
  }

  /* SVG 图标统一样式 */
  svg { width: 1em; height: 1em; fill: currentColor; }
</style>
</head>
<body>

<div class="phone-container">
  <!-- 顶部状态栏 (静态还原) -->
  <div class="status-bar">
    <div class="status-left">
      <span>16:08</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#3b82f6"><path d="M12 2L2 7l10 5 10-5-10-5z"/></svg>
    </div>
    <div class="status-right">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 100 20 10 10 0 000-20z"/></svg>
      <span style="font-size:12px">5G</span>
      <div class="icon-battery"></div>
    </div>
  </div>

  <!-- 顶部自由对话 -->
  <div class="top-controls">
    <div style="width:28px;"></div> <!-- 占位 -->
    <div class="mode-badge">
      <span class="wechat-icon">
        <svg width="20" height="20" viewBox="0 0 1024 1024"><path d="M674.9 425.4c4.8-14.5 7.1-29.6 7.1-45.1 0-88.1-74.4-159.6-166.2-159.6-96.5 0-174.7 67.3-166.4 150.8 4.8 46.5 28.6 86.8 62.1 113.2 6.9 5.1 11.4 13.1 11.4 22.1 0 6.4-2.4 12.5-6.4 17.1l-28.8 34.2c-5.5 6.5-8.5 14.8-8.5 23.4 0 15.9 12.9 28.8 28.8 28.8 5.9 0 11.7-1.8 16.6-5.1l40.5-26.7c6.1-4 13.2-6.1 20.5-6.1 6.5 0 12.8 1.8 18.6 5.1 25.3 13.5 54.5 21.2 85.4 21.2 27.9 0 54.5-5.7 78.2-16.1 32.4-13.4 59.4-35.6 76.1-63.6 15.4-25.6 23.8-55.1 23.8-85.4 0-31.8-9.4-62.5-27.1-89.7z" fill="#07C160"/></svg>
      </span>
      <span>自由对话</span>
      <span class="arrow">◇</span>
    </div>
    <div class="voice-user-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5"><path d="M12 2a10 10 0 100 20 10 10 0 000-20z"/><path d="M12 8v8"/><path d="M8 12h8"/></svg>
    </div>
  </div>

  <!-- 中间摄像头区域 -->
  <div class="camera-area">
    <!-- 悬浮控件 -->
    <div class="cam-overlay">
      <!-- 手电筒 -->
      <div class="cam-btn">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2v6m0 8v6M4.93 4.93l4.24 4.24m5.66 5.66l4.24 4.24M2 12h6m8 0h6"/><path d="M12 8a4 4 0 100 8 4 4 0 000-8z"/></svg>
      </div>
      
      <!-- 正在听 -->
      <div class="listening">
        <span class="dot"></span>
        <span>正在听...</span>
      </div>
      
      <!-- 翻转摄像头 -->
      <div class="cam-btn">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9a2 2 0 012-2h3l2-2h4l2 2h3a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path d="M8 14h8"/><path d="M12 11v6"/></svg>
      </div>
    </div>
  </div>

  <!-- 底部按钮组 -->
  <div class="bottom-actions">
    <!-- 视频 (开启状态) -->
    <button class="action-btn active">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
    </button>
    
    <!-- 麦克风 (开启状态) -->
    <button class="action-btn active">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 003-3V5a3 3 0 00-6 0v6a3 3 0 003 3z"/><path d="M19 11a7 7 0 01-14 0m7 10a10 10 0 0010-10"/></svg>
    </button>
    
    <!-- 字幕/静音 (禁用状态) -->
    <button class="action-btn disabled">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2" ry="2"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="7" y1="15" x2="13" y2="15"/><line x1="4" y1="4" x2="20" y2="20" stroke="#e85d4e" stroke-width="2"/></svg>
    </button>
    
    <!-- 挂断 -->
    <button class="action-btn hangup">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M12 9c-1.6 0-3.1.4-4.6 1l-2.8-2.8C6.5 4.8 9 4 12 4s5.5.8 7.4 3.2l-2.8 2.8C15.1 9.4 13.6 9 12 9z" transform="rotate(135 12 12)"/></svg>
    </button>
  </div>

  <div class="footer-text">内容由 AI 生成</div>
  <div class="home-indicator"></div>
</div>

</body>
</html>
