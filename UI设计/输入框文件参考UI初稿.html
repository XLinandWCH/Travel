<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>输入面板</title>
<style>
  body {
    background: #f2f2f2;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  .input-panel {
    width: 92%;
    max-width: 440px;
    padding: 16px;
    background: #fff;
    border-radius: 22px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
  }

  /* ===== 新的输入卡片 ===== */
  .input-card {
    position: relative;
    background: #fbfbfb;
    border: 1px solid #ececec;
    border-radius: 20px;
    padding: 16px 16px 60px; /* 底部留出工具栏高度 */
    box-shadow: 0 6px 20px rgba(0,0,0,0.06);
    margin-bottom: 14px;
  }

  .input-card textarea {
    width: 100%;
    border: none;
    background: transparent;
    resize: none;
    outline: none;
    font-size: 17px;
    line-height: 1.5;
    font-family: inherit;
    color: #333;
    min-height: 56px;
  }

  /* 占位符 */
  .placeholder {
    position: absolute;
    top: 16px;
    left: 16px;
    font-size: 17px;
    line-height: 1.5;
    color: #b3b3b3;
    pointer-events: none;
    transition: opacity .15s;
  }
  .input-card.has-text .placeholder { opacity: 0; }

  /* 底部工具栏 */
  .toolbar {
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* 左侧 + 按钮 */
  .plus-btn {
    width: 34px;
    height: 34px;
    border: 1.5px solid #c7c7c7;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background: transparent;
    padding: 0;
    flex-shrink: 0;
  }
  .plus-btn svg { stroke: #8a8a8a; }

  .model-tag {
    font-size: 15px;
    color: #3d3d3d;
    font-weight: 400;
    margin-left: 10px;
    cursor: pointer;
    white-space: nowrap;
  }

  .left-group {
    display: flex;
    align-items: center;
  }

  /* 右侧麦克风 */
  .mic-btn {
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 13px;
    background: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
  }
  .mic-btn svg { stroke: #fff; }

  /* ===== 底部功能区（保持不变） ===== */
  .action-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .action-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: #f9f9f9;
    border-radius: 12px;
    padding: 15px 0;
    cursor: pointer;
    transition: background-color 0.2s;
  }
  .action-item:hover { background-color: #f0f0f0; }

  .action-item .icon {
    width: 24px;
    height: 24px;
    margin-bottom: 8px;
    fill: none;
    stroke: #333;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .action-text { font-size: 14px; color: #333; }
</style>
</head>
<body>

<div class="input-panel">
  <!-- 新输入卡片 -->
  <div class="input-card" id="inputCard">
    <span class="placeholder">Ask anything</span>
    <textarea id="editor" rows="2" spellcheck="false"></textarea>

    <div class="toolbar">
      <div class="left-group">
        <button class="plus-btn" title="更多">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
        <span class="model-tag">Fast</span>
      </div>

      <button class="mic-btn" title="语音输入">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="12" rx="3"/>
          <path d="M5 10v2a7 7 0 0 0 14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- 底部功能区（保持原样） -->
  <div class="action-grid">
    <div class="action-item">
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      <span class="action-text">拍照</span>
    </div>
    <div class="action-item">
      <svg class="icon" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
      <span class="action-text">相册</span>
    </div>
    <div class="action-item">
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
      </svg>
      <span class="action-text">本地文件</span>
    </div>
  </div>
</div>

<script>
  const editor = document.getElementById('editor');
  const card = document.getElementById('inputCard');

  // 输入时隐藏占位符，并自动增高
  editor.addEventListener('input', () => {
    card.classList.toggle('has-text', editor.value.length > 0);
    editor.style.height = 'auto';
    editor.style.height = editor.scrollHeight + 'px';
  });

  // 回车发送（Shift+回车换行）
  editor.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (editor.value.trim()) {
        console.log('发送：', editor.value);
        editor.value = '';
        card.classList.remove('has-text');
        editor.style.height = 'auto';
      }
    }
  });
</script>

</body>
</html>
