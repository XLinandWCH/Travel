<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>景区助手</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #121212; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .mobile { width: 100vw; height: 100vh; background: #121212; display: flex; flex-direction: column; position: relative; overflow: hidden; }
    .main { flex: 1; padding: 60px 20px 200px; overflow-y: auto; }
    .greeting { font-size: 26px; margin-bottom: 32px; font-weight: 600; letter-spacing: 0.5px; }
    .bubble { background: #2a2a2a; padding: 16px 20px; border-radius: 24px; margin-bottom: 14px; font-size: 17px; color: #e0e0e0; max-width: 88%; line-height: 1.5; }

    .bottom-area { position: absolute; bottom: 34px; left: 0; right: 0; background: transparent; padding: 0 18px 10px; z-index: 10; }
    .quick-container { position: relative; margin-bottom: 12px; }
    .quick-bar { display: flex; gap: 12px; overflow-x: auto; scroll-behavior: smooth; padding: 6px 0; -webkit-overflow-scrolling: touch; }
    .quick-bar::-webkit-scrollbar { display: none; }
    .quick-item { background: #2a2a2a; padding: 10px 18px; border-radius: 25px; font-size: 15px; white-space: nowrap; color: #f0f0f0; display: flex; align-items: center; gap: 6px; font-weight: 400; }
    .quick-item .arrow { font-size: 13px; opacity: 0.7; }
    .menu-btn { position: absolute; right: 0; top: 50%; transform: translateY(-50%) translateX(100%); background: #333; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; opacity: 0; transition: all 0.3s; box-shadow: -3px 0 8px rgba(0,0,0,0.6); cursor: pointer; }
    .menu-btn.show { opacity: 1; transform: translateY(-50%) translateX(0); }
    .menu-btn span { display: block; width: 18px; height: 2.5px; background: #ddd; margin: 3px 0; border-radius: 2px; }

    .input-bar { background: #2a2a2a; border-radius: 33px; padding: 12px 18px; display: flex; align-items: center; gap: 14px; backdrop-filter: blur(10px); }
    .input-icon { width: 24px; height: 24px; color: #999; }
    .input-text { flex: 1; background: transparent; border: none; color: #888; font-size: 16px; outline: none; }
    .right-icons { display: flex; gap: 18px; align-items: center; }
    .voice-icon, .plus-icon { width: 24px; height: 24px; color: #eee; cursor: pointer; }
    .footer-tip { text-align: center; font-size: 12px; color: #555; margin-top: 10px; letter-spacing: 0.3px; }

    .panel-mask { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.45); opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 99; }
    .panel-mask.show { opacity: 1; pointer-events: auto; }
    .panel { position: fixed; bottom: 98px; left: 18px; right: 18px; background: #1e1e1e; border-radius: 28px; padding: 22px 12px 28px; transform: translateY(120%); transition: transform 0.35s cubic-bezier(0.08, 0.82, 0.165, 1); z-index: 100; box-shadow: 0 -4px 30px rgba(0,0,0,0.6); }
    .panel.show { transform: translateY(0); }
    .panel-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 14px 0; border-bottom: 1px solid #2e2e2e; text-align: center; font-size: 15px; color: #e8e8e8; }
    .panel-row:last-child { border-bottom: none; }
    .item { padding: 8px 0; border-radius: 12px; transition: background 0.15s; }
    .item:active { background: #2a2a2a; }
  </style>
</head>
<body>
<div class="mobile">
  <div class="main">
    <div class="greeting">Hi, 想去哪玩</div>
    <div class="bubble">黄山一日游最佳路线推荐</div>
    <div class="bubble">西湖边有哪些免费又好看的景点</div>
    <div class="bubble">带孩子去故宫应该怎么逛</div>
    <div class="bubble">景区附近有什么地道美食</div>
  </div>

  <div class="bottom-area">
    <div class="quick-container">
      <div class="quick-bar" id="quickBar">
        <div class="quick-item">路线规划</div>
        <div class="quick-item">景点推荐</div>
        <div class="quick-item">周边查询</div>
        <div class="quick-item">现场避坑</div>
        <div class="quick-item">表演时间</div>
      </div>
      <div class="menu-btn" id="menuBtn"><span></span><span></span><span></span></div>
    </div>

    <div class="input-bar">
      <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      <input type="text" class="input-text" placeholder="发消息或按住说话..." readonly>
      <div class="right-icons">
        <svg class="voice-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        <svg class="plus-icon" id="plusBtn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </div>
    </div>

  </div>

  <div class="panel-mask" id="panelMask"></div>
  <div class="panel" id="panel">
    <div class="panel-row">
      <div class="item">景点推荐</div><div class="item">周边查询</div><div class="item">现场避坑</div><div class="item">表演时间</div>
    </div>
    <div class="panel-row">
      <div class="item">求助咨询</div><div class="item">门票预订</div><div class="item">深度游玩</div><div class="item">美食攻略</div>
    </div>
    <div class="panel-row">
      <div class="item">交通导航</div><div class="item">景点讲解</div><div class="item">外卖助手</div><div class="item">AI精讲</div>
    </div>
    <div class="panel-row">
      <div class="item">行程规划</div><div class="item">个人计划</div><div class="item">消费记录</div><div class="item">客流分析</div>
    </div>
    <div class="panel-row">
      <div class="item">答题闯关</div><div class="item">旅游计划</div><div class="item">饮食助手</div><div class="item"></div>
    </div>
  </div>
</div>

<script>
  const quickBar = document.getElementById('quickBar');
  const menuBtn = document.getElementById('menuBtn');
  const panel = document.getElementById('panel');
  const panelMask = document.getElementById('panelMask');
  const plusBtn = document.getElementById('plusBtn');

  quickBar.addEventListener('scroll', () => {
    if (quickBar.scrollLeft > 20) {
      menuBtn.classList.add('show');
    } else {
      menuBtn.classList.remove('show');
    }
  });

  menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    panel.classList.add('show');
    panelMask.classList.add('show');
  });

  plusBtn.addEventListener('click', () => {
    panel.classList.add('show');
    panelMask.classList.add('show');
  });

  panelMask.addEventListener('click', () => {
    panel.classList.remove('show');
    panelMask.classList.remove('show');
  });
</script>
</body>
</html>
